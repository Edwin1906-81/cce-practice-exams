<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCE Practice Exam 2</title>
<style>
:root{--hdr:#1f3a64;--hdr2:#2c4f85;--bg:#eef1f5;--card:#fff;--line:#d5dbe3;--text:#1b2430;--muted:#5f6c7b;
  --ok:#1f8a4c;--okbg:#e6f4ec;--bad:#c62f2f;--badbg:#fbeaea;--sel:#e8effa;--accent:#2c6bc9;--flag:#e08a00}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
a{color:var(--accent)}

/* ---------- start / results pages ---------- */
.page{max-width:900px;margin:0 auto;padding:20px 16px 40px}
.brand{background:var(--hdr);color:#fff;padding:14px 18px;border-radius:10px 10px 0 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand h1{margin:0;font-size:1.35em}
.logo{display:inline-flex;background:#fff;border-radius:8px;padding:4px 8px;flex:0 0 auto;line-height:0}
.logo img{height:44px;width:auto;display:block}
.top .logo{padding:3px 6px;border-radius:6px}
.top .logo img{height:30px}
@media (max-width:760px){.logo img{height:34px}.top .logo img{height:24px}.top{padding:6px}.top .l,.top .r{gap:6px}.ic{padding:6px 9px}.timer{font-size:.85em;padding:4px 6px}.flagbtn{padding:6px 7px}}
.brand p{margin:4px 0 0;opacity:.85;font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:0 0 10px 10px;padding:20px;margin-bottom:18px}
.card.solo{border-radius:10px}
.card h2{margin:0 0 12px;font-size:1.1em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field label{display:block;font-size:.85em;color:var(--muted);margin-bottom:4px}
.field input{width:100%;max-width:360px;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mode{border:2px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;text-align:left}
.mode b{display:block;margin-bottom:4px}
.mode span{font-size:.88em;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--sel)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:11px 20px;font-weight:700}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:6px 12px;font-size:.85em}
.btn.red{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.9em}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.82em;text-transform:uppercase;letter-spacing:.03em}
tr.click{cursor:pointer}
tr.click:hover td{background:#f6f8fb}
.pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.78em;font-weight:700;color:#fff}
.pill.ok{background:var(--ok)}.pill.bad{background:var(--bad)}.pill.om{background:#8a96a6}
.scorebox{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-size:3em;font-weight:800;color:var(--hdr);line-height:1}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--bg);border-radius:8px;padding:10px 14px;min-width:96px}
.stat b{display:block;font-size:1.3em}
.stat span{font-size:.8em;color:var(--muted)}
.meter{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex;margin:14px 0 4px}
.meter i{display:block;height:100%}
.muted{color:var(--muted);font-size:.88em}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.scroll{overflow-x:auto}

/* ---------- exam interface ---------- */
.shell{display:flex;flex-direction:column;height:100vh}
.top{background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;gap:8px;flex:0 0 auto}
.top .l,.top .r{display:flex;align-items:center;gap:10px;flex:1}
.top .r{justify-content:flex-end}
.top .c{display:flex;gap:4px}
.item{font-weight:700;font-size:.95em;white-space:nowrap}
.qid{font-size:.75em;opacity:.8;white-space:nowrap}
.ic{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 12px;font-size:1em;line-height:1}
.ic:hover:not(:disabled){background:var(--hdr2)}
.flagbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 10px;font-size:.85em;white-space:nowrap}
.flagbtn.on{background:var(--flag);border-color:var(--flag)}
.timer{font-family:"Courier New",monospace;font-weight:700;background:rgba(0,0,0,.2);padding:5px 10px;border-radius:6px;white-space:nowrap}
.timer.low{background:var(--bad)}
.body{flex:1;display:flex;min-height:0}
.nav{width:76px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;flex:0 0 auto}
.nav button{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;border:0;border-bottom:1px solid #edf0f4;background:#fff;padding:9px 4px;font-size:.88em;position:relative}
.nav button.cur{background:var(--sel);font-weight:700;box-shadow:inset 4px 0 0 var(--accent)}
.nav button.ans:not(.rv)::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);position:absolute;right:8px}
.nav button.rv.ok{color:var(--ok)}
.nav button.rv.bad{color:var(--bad)}
.nav .fl{color:var(--flag);font-size:.85em}
.main{flex:1;overflow-y:auto;padding:22px 26px 40px;background:#fff}
.qwrap{max-width:860px}
.stem{line-height:1.6;margin:0 0 16px;font-size:1.02em}
.media{margin:0 0 18px;display:grid;gap:10px;max-width:640px}
.media img,.media video{width:100%;border:1px solid var(--line);border-radius:4px;background:#000;display:block}
.media .frame{position:relative;padding-top:56.25%}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.choices{border:1px solid var(--line);border-radius:4px;max-width:640px;margin-bottom:16px}
.ch{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #edf0f4;padding:11px 12px;line-height:1.45}
.ch:last-child{border-bottom:0}
.ch:hover:not(:disabled){background:#f6f8fb}
.ch:disabled{cursor:default;color:inherit;opacity:1}
.radio{flex:0 0 18px;height:18px;border:2px solid #8a96a6;border-radius:50%;margin-top:2px;position:relative}
.ch.sel .radio{border-color:var(--accent)}
.ch.sel .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.ch .mk{flex:0 0 20px;font-weight:800;text-align:center}
.ch.ok{background:var(--okbg)} .ch.ok .mk{color:var(--ok)}
.ch.bad{background:var(--badbg)} .ch.bad .mk{color:var(--bad)}
.ch.strike .txt{text-decoration:line-through;color:#9aa5b3}
.hint{font-size:.8em;color:var(--muted);margin:-8px 0 16px}
.exp{border-top:3px solid var(--hdr);padding-top:16px;margin-top:8px}
.verdict{font-weight:700;font-size:1.05em;margin-bottom:10px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.om{color:var(--muted)}
.exp h3{margin:0 0 8px;font-size:1em;color:var(--hdr)}
.exp p{line-height:1.6;margin:0 0 10px}
.obj{background:#f2f6fc;border-left:4px solid var(--hdr);padding:10px 14px;margin:14px 0}
.obj b{display:block;color:var(--hdr);font-size:.82em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.refs{font-size:.8em;color:var(--muted)}
.bot{background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px;flex:0 0 auto}
.bot .lab{font-size:.85em;opacity:.85}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:6px;font-size:.9em;z-index:9}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal{background:#fff;border-radius:10px;padding:20px;max-width:380px;width:100%}
.modal h3{margin:0 0 8px}
.modal .actions{justify-content:flex-end}

@media (max-width:760px){
  .nav{position:absolute;top:48px;bottom:48px;left:0;z-index:5;box-shadow:2px 0 8px rgba(0,0,0,.15);display:none}
  .nav.open{display:block}
  .main{padding:16px 14px 30px}
  .qid{display:none}
  .modes{grid-template-columns:1fr}
  .hidesm{display:none}
}
@media (min-width:761px){#navbtn{display:none}}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .card{border:0;padding:0}
  .page{padding:0}
}
</style>
</head>

const QUIZ = {
 "id": "cce-practice-exam-2",
 "title": "CCE Practice Exam 2",

 "logo": "",
 "questions": [
  {
   "id": "PE2-01",
   "topic": "LV systolic function",
   "stem": "On the CW Doppler MR jet, the time for velocity to rise from 1 m/s to 3 m/s is 40 ms. What is the LV dP/dt, and what does it suggest?",
   "image": "",
   "video": "",
   "choices": [

   "objective": "LV dP/dt = 32 mmHg / time from 1 to 3 m/s on the MR jet; normal is over about 1,200 mmHg/s.",

   "id": "PE2-02",
   "topic": "Cardiac output",
   "stem": "LVOT diameter is 2.0 cm, LVOT VTI is 15 cm, and heart rate is 110/min. What is the cardiac output?",
   "image": "",
   "video": "",
   "choices": [

    "4.1 L/min",
    "5.2 L/min",
    "6.6 L/min"

   "answer": "C",

    "LVOT area = 0.785 x 4 = 3.14 cm2. Stroke volume = 3.14 x 15 = 47 mL. Cardiac output = 47 mL x 110 = 5.2 L/min.",

   ],
   "objective": "CO = 0.785 x D squared x VTI x HR.",

  {
   "id": "PE2-03",
   "topic": "Diastolic function",
   "stem": "A 74-year-old with hypertension has E/A of 0.7, deceleration time of 260 ms, septal e' of 5 cm/s, average E/e' of 9, and normal LA volume. What is the classification?",
   "image": "",
   "video": "",
   "choices": [
    "Normal for age with no dysfunction",
    "Grade I diastolic dysfunction with normal filling pressure",
    "Grade II diastolic dysfunction",
    "Grade III diastolic dysfunction"
   ],
   "answer": "B",
   "explanation": [
    "Impaired relaxation shows a small E wave, a dominant A wave (E/A 0.8 or less), and a prolonged deceleration time. Filling pressure is normal here (E/e' under 14, normal LA volume), so this is Grade I.",

  {
   "id": "PE2-04",
   "topic": "Diastolic function",
   "stem": "In a patient in sinus rhythm with normal mitral valve, pulmonary vein Doppler shows a systolic (S) wave smaller than the diastolic (D) wave. What does this suggest?",
   "image": "",
   "video": "",
   "choices": [
    "Elevated left atrial pressure",
    "Hypovolemia",
    "Severe aortic stenosis",
    "Normal finding in all adults"
   ],
   "answer": "A",
   "explanation": [
    "Normally S is equal to or larger than D after early adulthood. When LA pressure rises, LA filling in systole falls, so S becomes blunted and smaller than D. Severe MR can reverse S.",
    "Young healthy people can have D larger than S because of brisk LV relaxation, so interpret the pattern with age and other findings."
   ],
   "objective": "A blunted pulmonary vein S wave (S less than D) suggests elevated LA pressure in older adults.",

   "id": "PE2-05",

   "choices": [

    "Resting obstructive HCM",
    "Fixed subaortic membrane"
   ],
   "answer": "B",
   "explanation": [
    "Obstruction is defined as a peak LVOT gradient of 30 mmHg or more. A gradient under 30 at rest that rises to 30 or more with provocation (Valsalva, standing, exercise) is latent obstruction. A gradient of 50 or more is usually considered the threshold for intervention.",
    "Valsalva lowers preload, which shrinks the LV cavity and worsens SAM. A fixed membrane would not change much with preload."
   ],
   "objective": "Latent obstructive HCM: rest gradient under 30 mmHg rising to 30 or more with provocation.",
   "refs": "Study Guide 01.A.05, Hypertrophic Cardiomyopathy",
   "mediaNote": "CW Doppler of LVOT at rest and with Valsalva"

  {
   "id": "PE2-06",
   "topic": "Cardiac tumors",
   "stem": "A mobile, gelatinous left atrial mass attached by a stalk to the fossa ovalis prolapses through the mitral valve in diastole. What is the most likely diagnosis?",
   "image": "",
   "video": "",
   "choices": [
    "Left atrial appendage thrombus",
    "Papillary fibroelastoma",
    "Lipomatous hypertrophy of the septum",
    "Atrial myxoma"
   ],
   "answer": "D",
   "explanation": [
    "Myxomas are the most common primary cardiac tumor, and about 90% are in the left atrium, typically attached to the interatrial septum near the fossa ovalis. They can obstruct the mitral valve and embolize.",
    "Fibroelastomas are small and usually on valve surfaces. Thrombus favors the LA appendage. Lipomatous hypertrophy spares the fossa ovalis, giving a dumbbell shape."
   ],
   "objective": "Myxoma: LA mass attached to the fossa ovalis.",
   "refs": "Study Guide 01.A.04, Benign cardiac tumors",
   "mediaNote": "Apical 4-chamber clip of a mobile LA mass attached to the septum"
  },
  {
   "id": "PE2-07",
   "topic": "Pseudotumors",
   "stem": "A thin, mobile, fenestrated structure is seen in the right atrium near the IVC entrance in an asymptomatic patient. What is the most likely identity?",
   "image": "",
   "video": "",
   "choices": [
    "Tricuspid vegetation",
    "Atrial myxoma",
    "Chiari network",
    "Right atrial thrombus in transit"
   ],
   "answer": "C",
   "explanation": [
    "The Chiari network is a normal embryologic remnant: a thin, lacy, highly mobile structure near the IVC and coronary sinus openings. The Eustachian valve is a similar but more ridge-like remnant at the IVC entrance.",
    "Thrombus in transit is usually serpiginous and found with acute PE and RV strain. Vegetations sit on valve leaflets."
   ],
   "objective": "Chiari network and Eustachian valve are normal RA variants, not pathology.",
   "refs": "Study Guide 01.A.04, Pseudo-tumors, Right Atrium",
   "mediaNote": "Subcostal RA view with a mobile filamentous structure"
  },
  {
   "id": "PE2-08",
   "topic": "Systemic disease",
   "stem": "A patient with heart failure has increased LV wall thickness, low QRS voltage on ECG, biatrial enlargement, and a small pericardial effusion. Strain imaging shows relative apical sparing. What is the most likely diagnosis?",
   "image": "",
   "video": "",
   "choices": [
    "Cardiac amyloidosis",
    "Hypertrophic cardiomyopathy",
    "Hypertensive heart disease",
    "Athlete's heart"
   ],
   "answer": "A",

    "Hypertensive heart disease and HCM usually have normal or high voltage. Athlete's heart has normal diastolic function and mild symmetric thickening."
   ],
   "objective": "Thick LV walls with low voltage and apical-sparing strain suggest amyloidosis.",
   "refs": "Study Guide 06, Amyloidosis",
   "mediaNote": "Parasternal views of thick LV walls with a sparkling texture"
  },
  {
   "id": "PE2-09",
   "topic": "RV function",
   "stem": "RV end-diastolic area is 24 cm2 and end-systolic area is 18 cm2. What is the RV fractional area change, and what does it indicate?",
   "image": "",
   "video": "",
   "choices": [
    "25%, RV systolic dysfunction",
    "33%, normal RV function",
    "50%, normal RV function",
    "75%, hyperdynamic RV"
   ],
   "answer": "A",
   "explanation": [
    "FAC = (EDA - ESA) / EDA = (24 - 18) / 24 = 25%. An FAC under 35% indicates RV systolic dysfunction.",
    "FAC includes radial and longitudinal motion but depends on clear endocardial borders, including the trabeculated RV free wall."
   ],
   "objective": "RV FAC under 35% indicates RV systolic dysfunction.",
   "refs": "Study Guide 01.A.06, Fractional area change",
   "mediaNote": "RV-focused apical view with end-diastolic and end-systolic tracings"
  },
  {
   "id": "PE2-10",
   "topic": "RV function",
   "stem": "Tissue Doppler at the lateral tricuspid annulus shows a peak systolic velocity (S') of 8 cm/s. What is the interpretation?",
   "image": "",
   "video": "",
   "choices": [
    "LV diastolic dysfunction",
    "Normal RV systolic function",
    "RV systolic dysfunction",
    "Cannot be interpreted without TAPSE"
   ],
   "answer": "C",
   "explanation": [
    "RV S' under 9.5 cm/s suggests RV systolic dysfunction. It is reproducible and correlates with RV EF.",
    "Measure the main systolic wave after the QRS, not the brief isovolumic contraction spike, and keep the beam aligned with annular motion."
   ],
   "objective": "RV S' under 9.5 cm/s is abnormal.",
   "refs": "Study Guide 01.A.06, DTI-derived tricuspid lateral annular systolic velocity",
   "mediaNote": "Tissue Doppler at the lateral tricuspid annulus"
  },
  {
   "id": "PE2-11",
   "topic": "RV size",
   "stem": "In an RV-focused apical 4-chamber view, which basal RV diameter indicates RV dilation per ASE?",
   "image": "",
   "video": "",
   "choices": [
    "Over 28 mm",
    "Over 35 mm",
    "Over 41 mm",
    "Over 55 mm"
   ],
   "answer": "C",
   "explanation": [
    "ASE defines RV dilation as a basal diameter over 41 mm, mid-cavity diameter over 35 mm, or longitudinal dimension over 83 mm in the RV-focused view.",
    "The RV-focused view gives larger and more reproducible values than the standard apical 4-chamber view."
   ],
   "objective": "RV basal diameter over 41 mm in the RV-focused view is dilated.",
   "refs": "Study Guide B.01, Linear measurements",
   "mediaNote": "RV-focused apical 4-chamber view with basal diameter measured"

  {
   "id": "PE2-12",
   "topic": "RV infarction",

   "image": "",
   "video": "",
   "choices": [

    "Nitroglycerin",
    "Inotropic support if needed",
    "Maintaining AV synchrony"
   ],
   "answer": "B",
   "explanation": [
    "RV infarction makes the cardiac output preload dependent. Nitrates and diuretics lower preload and can cause profound hypotension.",
    "Management includes careful volume loading, maintaining AV synchrony, inotropes if needed, and reperfusion."
   ],
   "objective": "RV infarction is preload dependent; avoid nitrates and diuretics.",
   "refs": "Study Guide 01.A.06, Right ventricle",
   "mediaNote": "Apical 4-chamber with dilated hypokinetic RV in inferior STEMI"
  },
  {
   "id": "PE2-13",
   "topic": "Pulmonary embolism",
   "stem": "A patient with sudden dyspnea has a PA acceleration time of 55 ms and a TR-derived RV systolic pressure of 45 mmHg. What does this combination most suggest?",
   "image": "",
   "video": "",
   "choices": [
    "Left heart disease",
    "Normal pulmonary pressures",
    "Chronic thromboembolic pulmonary hypertension",
    "Acute pulmonary embolism"
   ],
   "answer": "D",
   "explanation": [
    "The 60/60 sign (PAAT under 60 ms with RVSP under 60 mmHg) has about 94% specificity for acute PE. The short acceleration time reflects high resistance, while the modest pressure reflects an unconditioned RV that cannot generate high pressures acutely.",
    "Chronic pulmonary hypertension usually allows the RV to hypertrophy and generate higher systolic pressures."
   ],
   "objective": "60/60 sign: PAAT under 60 ms with RVSP under 60 mmHg suggests acute PE.",
   "refs": "Study Guide 02.C.03, 60/60 Sign",
   "mediaNote": "RVOT PW Doppler and TR CW Doppler"

   "id": "PE2-14",
   "topic": "Aortic stenosis",

   "image": "",
   "video": "",
   "choices": [

   ],
   "answer": "B",
   "explanation": [
    "Doppler measures the peak instantaneous gradient. Catheterization often reports a peak-to-peak gradient between the LV peak and the later aortic peak, which are not simultaneous. The peak instantaneous gradient is always larger.",
    "Mean gradients from echo and catheterization agree better. Pressure recovery in a small aorta can also make Doppler gradients higher than catheter gradients."
   ],
   "objective": "Doppler peak instantaneous gradient exceeds catheter peak-to-peak gradient; compare mean gradients.",
   "refs": "Study Guide 01.D.01.1, Differences between echo and cath gradients"
  },
  {
   "id": "PE2-15",
   "topic": "Aortic regurgitation",
   "stem": "A patient with acute aortic dissection develops severe acute AR. Which finding signals markedly elevated LV diastolic pressure and the need for urgent surgery?",

   "video": "",

   "stem": "Which change will increase the 2D frame rate?",
   "image": "",
   "video": "",
   "choices": [
    "Decrease the depth and narrow the sector",
    "Increase the imaging depth",
    "Add more focal zones",
    "Widen the sector"
   ],
   "answer": "A",
   "explanation": [
    "Frame rate depends on how many scan lines are needed and how long each takes. Shallower depth shortens each line, and a narrower sector reduces the number of lines, both raising frame rate.",
    "More depth, a wider sector, and multiple focal zones all lower frame rate."
   ],
   "objective": "Shallower depth and a narrower sector raise frame rate.",
   "refs": "Study Guide 03.A, Physics"
  },
  {
   "id": "PE2-44",
   "topic": "Physics",
   "stem": "Which statement about pulsed wave and continuous wave Doppler is correct?",
   "image": "",
   "video": "",
   "choices": [
    "Both have range resolution",
    "CW has range resolution and aliases at high velocities",
    "PW has range resolution but aliases at high velocities; CW measures high velocities but cannot localize depth",
    "PW is preferred for measuring severe AS velocity"
   ],
   "answer": "C",
   "explanation": [
    "PW samples at one depth, giving range resolution, but its maximum measurable velocity is limited by the Nyquist limit. CW sends and receives continuously, so it does not alias but records all velocities along the beam (range ambiguity).",
    "Use CW for high velocities such as AS, MR, and TR jets."
   ],
   "objective": "PW: range resolution with aliasing; CW: no aliasing but range ambiguity.",
   "refs": "Study Guide 03.A.02, Continuous wave and Pulse wave"
  },
  {
   "id": "PE2-45",
   "topic": "Color Doppler",
   "stem": "On standard color Doppler settings, flow in the apical 4-chamber view moving from the LA into the LV toward the transducer is displayed as what color?",
   "image": "",
   "video": "",
   "choices": [
    "Green",
    "Blue",
    "Black",
    "Red"
   ],
   "answer": "D",
   "explanation": [
    "With the BART convention (blue away, red toward), flow toward the transducer is red. Mitral inflow at the apex moves toward the probe, so it is red.",
    "Aliasing wraps fast flow into the opposite color, and variance maps add green for turbulence."
   ],
   "objective": "BART: blue away, red toward the transducer.",
   "refs": "Study Guide 03.A.02, Is BART the best?",
   "mediaNote": "Apical 4-chamber color Doppler of mitral inflow"
  },
  {
   "id": "PE2-46",
   "topic": "Artifacts",
   "stem": "Which artifact makes a structure deep to a highly attenuating object appear dark, as with a calcified valve?",
   "image": "",
   "video": "",
   "choices": [
    "Side lobe",
    "Acoustic shadowing",
    "Acoustic enhancement",
    "Mirror image"
   ],
   "answer": "B",
   "explanation": [
    "Calcium, metal, and bone reflect or absorb most of the beam, leaving little energy for deeper tissue, which appears dark (shadowing).",
    "Enhancement is the opposite: deep to a weakly attenuating structure such as fluid, tissue appears brighter."
   ],
   "objective": "Shadowing occurs deep to strongly attenuating structures.",
   "refs": "Study Guide 03.B.04.12, Acoustic shadowing"
  },
  {
   "id": "PE2-47",
   "topic": "M-mode",
   "stem": "On mitral valve M-mode, a notch on the closing slope between the A and C points (B-bump) indicates what?",
   "image": "",
   "video": "",
   "choices": [
    "Severe aortic regurgitation",
    "Normal finding",
    "Elevated LV end-diastolic pressure",
    "Mitral stenosis"
   ],
   "answer": "C",
   "explanation": [
    "The B-bump (A-C shoulder) occurs when high LV end-diastolic pressure interrupts mitral closure after atrial contraction. It suggests LVEDP over about 20 mmHg.",
    "Mitral stenosis shows a flat E-F slope and anterior motion of the posterior leaflet."
   ],
   "objective": "B-bump on mitral M-mode indicates elevated LVEDP.",
   "refs": "Study Guide 03.A.03, B-Bump",
   "mediaNote": "M-mode of the mitral valve with an A-C shoulder (B-bump)"
  },
  {
   "id": "PE2-48",
   "topic": "M-mode",
   "stem": "Aortic valve M-mode shows partial mid-systolic closure of the leaflets in a patient with a thickened septum and SAM. What does this indicate?",
   "image": "",
   "video": "",
   "choices": [
    "Dynamic LVOT obstruction",
    "Low stroke volume from hypovolemia only",
    "Bicuspid aortic valve",
    "Severe aortic stenosis"
   ],
   "answer": "A",
   "explanation": [
    "In dynamic LVOT obstruction, flow drops abruptly in mid-systole as SAM obstructs the outflow tract, so the aortic leaflets partially close, then reopen.",
    "A bicuspid valve shows an eccentric closure line on M-mode."
   ],
   "objective": "Mid-systolic aortic valve closure on M-mode suggests dynamic LVOT obstruction.",
   "refs": "Study Guide 03.A.03, M-Mode Aortic Valve HCM",
   "mediaNote": "Aortic valve M-mode with mid-systolic closure"
  },
  {
   "id": "PE2-49",
   "topic": "TEE",
   "stem": "Which is an absolute contraindication to TEE?",
   "image": "",
   "video": "",
   "choices": [
    "Esophageal stricture or perforation",
    "Mild thrombocytopenia",
    "Atrial fibrillation",
    "Mechanical ventilation"
   ],
   "answer": "A",
   "explanation": [
    "Absolute contraindications include esophageal stricture, tumor, perforation or laceration, active upper GI bleeding, and recent esophageal surgery.",
    "Varices, coagulopathy, and prior chest radiation are relative contraindications that need a risk-benefit decision."
   ],
   "objective": "Esophageal stricture, perforation, tumor, and active upper GI bleeding are absolute TEE contraindications.",
   "refs": "Study Guide 03.D.1, Absolute contraindications"
  },
  {
   "id": "PE2-50",
   "topic": "Pleural",
   "stem": "A pleural effusion contains multiple septations and swirling echogenic debris. What does this most suggest?",
   "image": "",
   "video": "",
   "choices": [
    "Normal physiologic fluid",
    "Imaging artifact",
    "Exudate, such as a complicated parapneumonic effusion or empyema",
    "Transudate from heart failure"
   ],
   "answer": "C",
   "explanation": [
    "Septations, loculations, and echogenic material suggest an exudate. An anechoic effusion can be either a transudate or an exudate, so it still needs fluid analysis.",
    "Identify the diaphragm, liver or spleen, and lung before sampling, and avoid the intercostal vessels."
   ],
   "objective": "Septated or echogenic effusions suggest exudate; anechoic can be either.",
   "refs": "Study Guide 04.A.03, Pleural effusion",
   "mediaNote": "Lateral chest view of a septated effusion"
  }
 ]
};
</script>

<script>
/* ===================== QUIZ ENGINE (no edits needed) ===================== */
(function(){
const Q = QUIZ.questions, N = Q.length, L = "ABCDEFGH";
const KEY = "ppq_" + QUIZ.id;
const app = document.getElementById("app");
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const logo = () => QUIZ.logo ? `<a class="logo" href="${esc(QUIZ.logoLink || "#")}" target="_blank" rel="noopener" title="Pulmonary POCUS"><img src="${esc(QUIZ.logo)}" alt="Pulmonary POCUS logo"></a>` : "";
const ansIdx = q =>L.indexOf(String(q.answer).toUpperCase());
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

let S = null;      // active block
let V = null;      // what the exam screen is showing (S, or a review context)
let mode = "tutor", tick = null, lastAttempt = null;

const history = () => store.get(KEY + "_hist") || [];

function score(a){
  let c = 0, w = 0, o = 0;
  Q.forEach((q,i) => { if (a.ans[i] == null) o++; else if (a.ans[i] === ansIdx(q)) c++; else w++; });
  return { c, w, o, pct: Math.round(c / N * 100) };
}

/* ---------- media ---------- */
function clip(src){
  const yt = src.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (yt) return `<div class="frame"><iframe src="https://www.youtube.com/embed/${yt[1]}?loop=1&playlist=${yt[1]}&rel=0&playsinline=1" title="Question video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><a class="refs" href="https://www.youtube.com/watch?v=${yt[1]}" target="_blank" rel="noopener">Video not playing? Watch on YouTube</a>`;
  const vm = src.match(/vimeo\.com\/(\d+)/);
  if (vm) return `<div class="frame"><iframe src="https://player.vimeo.com/video/${vm[1]}?loop=1" allowfullscreen></iframe></div>`;
  if (/\.(mp4|webm|mov)(\?|$)/i.test(src)) return `<video src="${esc(src)}" autoplay muted loop playsinline controls></video>`;
  return `<img src="${esc(src)}" alt="Question image" loading="lazy">`;
}
function media(...srcs){
  const list = [].concat(...srcs.map(s => s || [])).filter(Boolean);
  return list.length ? `<div class="media">${list.map(clip).join("")}</div>` : "";
}

/* ---------- start screen ---------- */
function renderStart(){
  stopTimer();
  const inprog = store.get(KEY + "_cur"), h = history().slice().reverse(), name = store.get(KEY + "_name") || "";
  app.innerHTML = `
  <div class="page">
    <div class="brand"><div><h1>${esc(QUIZ.title)}</h1><p>${esc(QUIZ.subtitle)}</p></div>${logo()}</div>
    <div class="card">
      <div class="field"><label for="nm">Your name (shown on your score report)</label><input id="nm" value="${esc(name)}" placeholder="Optional"></div>
      <div class="modes">
        <button class="mode ${mode==="tutor"?"on":""}" data-m="tutor"><b>Study mode</b><span>Untimed. See the answer and explanation after each question.</span></button>
        <button class="mode ${mode==="timed"?"on":""}" data-m="timed"><b>Timed mode</b><span>${fmt(N*QUIZ.secondsPerQuestion)} for ${N} questions. Explanations at the end, like the real exam.</span></button>
      </div>
      <div class="actions">
        <button class="btn" id="go">Start new block (${N} questions)</button>
        ${inprog ? `<button class="btn ghost" id="resume">Resume block in progress (${inprog.mode}, item ${inprog.cur+1})</button>` : ""}
      </div>
    </div>
    <div class="card solo">
      <h2>Your previous attempts</h2>
      ${h.length ? `<div class="scroll"><table><tr><th>Date</th><th>Mode</th><th>Score</th><th>Correct</th><th>Time</th><th></th></tr>
        ${h.map(a => { const s = score(a); return `<tr><td>${new Date(a.date).toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}</td><td>${a.mode}</td><td><b>${s.pct}%</b></td><td>${s.c}/${N}</td><td>${fmt(a.elapsed)}</td>
          <td><button class="btn sm ghost" data-res="${a.id}">Results</button></td></tr>`; }).join("")}</table></div>
        <div class="actions"><button class="btn sm ghost" id="clr">Clear history</button></div>`
      : `<p class="muted">No attempts yet. Scores and question reviews are saved in this browser on this device.</p>`}
    </div>
  </div>`;
  app.querySelectorAll(".mode").forEach(b => b.onclick = () => { mode = b.dataset.m; saveName(); renderStart(); });
  app.querySelector("#go").onclick = () => { saveName(); start(); };
  const r = app.querySelector("#resume"); if (r) r.onclick = () => { S = inprog; V = S; startTimer(); renderExam(); };
  app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => renderResults(history().find(a => a.id == b.dataset.res)));
  const c = app.querySelector("#clr"); if (c) c.onclick = () => confirmBox("Clear all saved attempts?", "This removes your score history from this device.", "Clear", () => { store.del(KEY + "_hist"); renderStart(); });
}
function saveName(){ const el = app.querySelector("#nm"); if (el) store.set(KEY + "_name", el.value.trim()); }

function start(){
  S = { id: Date.now(), name: store.get(KEY + "_name") || "", mode, cur: 0,
        ans: Array(N).fill(null), sub: Array(N).fill(false), flag: Array(N).fill(false), strike: Q.map(() => []),
        time: Array(N).fill(0), elapsed: 0, limit: mode === "timed" ? N * QUIZ.secondsPerQuestion : 0, date: Date.now(), nav: false };
  V = S; save(); startTimer(); renderExam();
}
function save(){ if (S) store.set(KEY + "_cur", S); }

/* ---------- timer ---------- */
function startTimer(){
  stopTimer();
  tick = setInterval(() => {
    if (!S || V !== S) return;
    S.elapsed++; S.time[S.cur]++;
    if (S.elapsed % 5 === 0) save();
    const t = document.getElementById("timer");
    if (S.mode === "timed"){
      const left = S.limit - S.elapsed;
      if (t){ t.textContent = "⏱ " + fmt(left); t.classList.toggle("low", left <= 60); }
      if (left <= 0){ toast("Time is up"); finish(); }
    } else if (t) t.textContent = "⏱ " + fmt(S.elapsed);
  }, 1000);
}
function stopTimer(){ if (tick) clearInterval(tick); tick = null; }

/* ---------- exam / review screen ---------- */
function visible(){
  const all = [...Array(N).keys()];
  if (!V.review || V.filter === "all") return all;
  if (V.filter === "flagged") return all.filter(i => V.flag[i]);
  return all.filter(i => V.ans[i] !== ansIdx(Q[i]));
}
function revealed(i){ return V.review || (V.mode === "tutor" && V.sub[i]); }

function renderExam(){
  const i = V.cur, q = Q[i], rev = revealed(i), a = V.ans[i], ci = ansIdx(q);
  const vis = visible(), pos = vis.indexOf(i);
  const timerTxt = V.review ? "Review" : "⏱ " + fmt(V.mode === "timed" ? V.limit - V.elapsed : V.elapsed);
  const strike = (V.strike && V.strike[i]) || [];
  let verdict = "";
  if (rev){
    if (a == null) verdict = `<div class="verdict om">Omitted. The correct answer is ${L[ci]}.</div>`;
    else if (a === ci) verdict = `<div class="verdict ok">Correct</div>`;
    else verdict = `<div class="verdict bad">Incorrect. The correct answer is ${L[ci]}.</div>`;
  }
  app.innerHTML = `
  <div class="shell">
    <header class="top">
      <div class="l">
        <button class="ic" id="navbtn" aria-label="Question list">☰</button>
        <div><div class="item">Item ${i+1} of ${N}</div><div class="qid">Question Id: ${esc(q.id || i+1)}</div></div>
        ${V.review ? "" : `<button class="flagbtn ${V.flag[i]?"on":""}" id="flag">⚑ ${V.flag[i]?"Marked":"Mark"}</button>`}
      </div>
      <div class="c">
        <button class="ic" id="prev" ${pos<=0?"disabled":""} aria-label="Previous">◀</button>
        <button class="ic" id="next" ${pos>=vis.length-1?"disabled":""} aria-label="Next">▶</button>
      </div>
      <div class="r"><span class="timer" id="timer">${timerTxt}</span>${logo()}</div>
    </header>
    <div class="body">
      <aside class="nav ${V.nav?"open":""}" id="nav">
        ${vis.map(k => {
          const cls = ["n"]; if (k === i) cls.push("cur"); if (V.ans[k] != null) cls.push("ans");
          if (revealed(k)){ cls.push("rv", V.ans[k] === ansIdx(Q[k]) ? "ok" : "bad"); }
          return `<button class="${cls.join(" ")}" data-go="${k}">${k+1}${V.flag[k]?' <span class="fl">⚑</span>':""}</button>`;
        }).join("")}
      </aside>
      <main class="main" id="main"><div class="qwrap">
        <p class="stem">${esc(q.stem)}</p>
        ${media(q.image, q.video)}${(!q.image && !q.video && q.mediaNote && /[?&]edit/.test(location.search)) ? `<div class="slot" style="border:2px dashed #b58900;border-radius:6px;padding:10px;margin:8px 0;color:#7a5c00;font-size:.9em"><b>Media slot ${esc(q.id)}:</b> ${esc(q.mediaNote)}</div>` : ""}
        <div class="choices">
          ${q.choices.map((c,k) => {
            const cls = ["ch"];
            if (rev){ if (k === ci) cls.push("ok"); else if (k === a) cls.push("bad"); }
            else if (k === a) cls.push("sel");
            if (!rev && strike.includes(k)) cls.push("strike");
            const mark = rev ? (k === ci ? "✓" : k === a ? "✗" : "") : "";
            return `<button class="${cls.join(" ")}" data-k="${k}" ${rev?"disabled":""}>
              ${rev ? `<span class="mk">${mark}</span>` : `<span class="radio"></span>`}
              <span class="txt"><b>${L[k]}.</b> ${esc(c)}</span></button>`;
          }).join("")}
        </div>
        ${!rev ? `<p class="hint">Tip: right-click (or long-press) a choice to cross it out. Keys A to ${L[q.choices.length-1]} select, arrow keys move.</p>` : ""}
        ${!rev && V.mode === "tutor" ? `<button class="btn" id="submit" ${a==null?"disabled":""}>Submit</button>` : ""}
        ${rev ? `<div class="exp">${verdict}
          <h3>Explanation</h3>
          ${[].concat(q.explanation || []).map(p => `<p>${esc(p)}</p>`).join("")}
          ${media(q.explainImage, q.explainVideo)}
          ${q.objective ? `<div class="obj"><b>Educational objective</b>${esc(q.objective)}</div>` : ""}
          ${q.refs ? `<p class="refs">References: ${esc(q.refs)}</p>` : ""}
          ${V.review && V.time ? `<p class="refs">Time spent on this question: ${fmt(V.time[i])}</p>` : ""}
        </div>` : ""}
      </div></main>
    </div>
    <footer class="bot">
      <span class="lab hidesm">${V.review ? "Reviewing: " + ({all:"all questions", incorrect:"incorrect and omitted", flagged:"marked questions"})[V.filter] : (V.mode === "tutor" ? "Study mode" : "Timed mode")}</span>
      ${V.review ? `<button class="btn ghost sm" id="back">Back to results</button>` : `<button class="btn red sm" id="end">End block</button>`}
    </footer>
  </div>`;

  const $ = s => app.querySelector(s);
  $("#navbtn").onclick = () => { V.nav = !V.nav; $("#nav").classList.toggle("open", V.nav); };
  $("#prev").onclick = () => go(vis[pos-1]);
  $("#next").onclick = () => go(vis[pos+1]);
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { if (window.innerWidth <= 760) V.nav = false; go(+b.dataset.go); });
  app.querySelectorAll(".ch").forEach(b => {
    b.onclick = () => { if (rev) return; V.ans[i] = +b.dataset.k; V.strike[i] = strike.filter(x => x !== +b.dataset.k); save(); renderExam(); };
    b.oncontextmenu = e => { if (rev) return; e.preventDefault(); const k = +b.dataset.k;
      V.strike[i] = strike.includes(k) ? strike.filter(x => x !== k) : strike.concat(k);
      if (V.ans[i] === k) V.ans[i] = null; save(); renderExam(); };
  });
  if ($("#flag")) $("#flag").onclick = () => { V.flag[i] = !V.flag[i]; save(); renderExam(); };
  if ($("#submit")) $("#submit").onclick = () => { V.sub[i] = true; save(); renderExam(); };
  if ($("#end")) $("#end").onclick = () => {
    const left = V.ans.filter(x => x == null).length;
    confirmBox("End this block?", left ? `You have ${left} unanswered question${left>1?"s":""}. They will be scored as omitted.` : "All questions are answered.", "End block", finish);
  };
  if ($("#back")) $("#back").onclick = () => renderResults(V.attempt);
}
function go(k){ if (k == null) return; V.cur = k; save(); renderExam(); const m = document.getElementById("main"); if (m) m.scrollTop = 0; }

document.addEventListener("keydown", e => {
  if (!V || !document.getElementById("main") || document.querySelector(".modalbg")) return;
  if (e.target.tagName === "INPUT") return;
  const vis = visible(), pos = vis.indexOf(V.cur);
  if (e.key === "ArrowRight" || e.key === "ArrowDown"){ e.preventDefault(); go(vis[pos+1]); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp"){ e.preventDefault(); go(vis[pos-1]); }
  else if (!revealed(V.cur)){
    const k = L.indexOf(e.key.toUpperCase());
    if (k >= 0 && k < Q[V.cur].choices.length){ V.ans[V.cur] = k; save(); renderExam(); }
    else if (e.key === "Enter" && V.mode === "tutor" && V.ans[V.cur] != null){ V.sub[V.cur] = true; save(); renderExam(); }
  }
});

/* ---------- finish + results ---------- */
function finish(){
  stopTimer();
  const a = { id: S.id, date: S.date, name: S.name, mode: S.mode, ans: S.ans, flag: S.flag, time: S.time, elapsed: S.elapsed };
  const h = history().filter(x => x.id !== a.id); h.push(a); store.set(KEY + "_hist", h);
  store.del(KEY + "_cur"); S = null;
  closeModal(); renderResults(a);
}

function renderResults(a){
  if (!a) return renderStart();
  stopTimer(); V = null; lastAttempt = a;
  const s = score(a), answered = N - s.o;
  app.innerHTML = `
  <div class="page">
    <div class="brand"><div><h1>Score report: ${esc(QUIZ.title)}</h1>
      <p>${a.name ? esc(a.name) + " | " : ""}${new Date(a.date).toLocaleString([], {dateStyle:"medium", timeStyle:"short"})} | ${a.mode === "tutor" ? "Study" : "Timed"} mode</p></div>${logo()}</div>
    <div class="card">
      <div class="scorebox">
        <div><div class="big">${s.pct}%</div><div class="muted">Your score</div></div>
        <div class="stats">
          <div class="stat"><b style="color:var(--ok)">${s.c}</b><span>Correct</span></div>
          <div class="stat"><b style="color:var(--bad)">${s.w}</b><span>Incorrect</span></div>
          <div class="stat"><b>${s.o}</b><span>Omitted</span></div>
          <div class="stat"><b>${fmt(a.elapsed)}</b><span>Total time</span></div>
          <div class="stat"><b>${fmt(answered ? a.elapsed / N : 0)}</b><span>Avg per question</span></div>
        </div>
      </div>
      <div class="meter"><i style="width:${s.c/N*100}%;background:var(--ok)"></i><i style="width:${s.w/N*100}%;background:var(--bad)"></i><i style="width:${s.o/N*100}%;background:#c3cad4"></i></div>
      <div class="actions noprint">
        <button class="btn" data-rv="all">Review all questions</button>
        <button class="btn ghost" data-rv="incorrect">Review incorrect (${s.w + s.o})</button>
        <button class="btn ghost" data-rv="flagged">Review marked (${a.flag.filter(Boolean).length})</button>
        <button class="btn ghost" id="print">Print / save PDF</button>
        <button class="btn ghost" id="home">Back to start</button>
      </div>
    </div>
    <div class="card solo">
      <h2>Question breakdown</h2>
      <div class="scroll"><table>
        <tr><th>#</th><th>Topic</th><th>Your answer</th><th>Correct</th><th>Result</th><th>Time</th></tr>
        ${Q.map((q,i) => { const u = a.ans[i], ok = u === ansIdx(q);
          return `<tr class="click" data-q="${i}"><td>${i+1}${a.flag[i]?' <span style="color:var(--flag)">⚑</span>':""}</td><td>${esc(q.topic || q.id)}</td>
            <td>${u == null ? "None" : L[u]}</td><td>${L[ansIdx(q)]}</td>
            <td>${u == null ? '<span class="pill om">Omitted</span>' : ok ? '<span class="pill ok">Correct</span>' : '<span class="pill bad">Incorrect</span>'}</td>
            <td>${fmt(a.time[i])}</td></tr>`; }).join("")}
      </table></div>
      <p class="muted noprint">Tap any row to review that question with its explanation.</p>
    </div>
  </div>`;
  app.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => openReview(a, b.dataset.rv, null));
  app.querySelectorAll("[data-q]").forEach(r => r.onclick = () => openReview(a, "all", +r.dataset.q));
  app.querySelector("#print").onclick = () => window.print();
  app.querySelector("#home").onclick = renderStart;
  window.scrollTo(0, 0);
}

function openReview(a, filter, at){
  V = { review: true, attempt: a, filter, mode: a.mode, ans: a.ans, flag: a.flag, time: a.time, sub: Array(N).fill(true), strike: Q.map(() => []), cur: 0, nav: false };
  const vis = visible();
  if (!vis.length){ V = null; toast(filter === "flagged" ? "No marked questions in this attempt" : "No incorrect questions. Nice work!"); return; }
  V.cur = at != null ? at : vis[0];
  renderExam();
}

/* ---------- helpers ---------- */
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function closeModal(){ const m = document.querySelector(".modalbg"); if (m) m.remove(); }
function confirmBox(title, body, okText, onOk){
  closeModal();
  const d = document.createElement("div"); d.className = "modalbg";
  d.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p class="muted">${esc(body)}</p>
    <div class="actions"><button class="btn ghost" id="mc">Cancel</button><button class="btn red" id="mo">${esc(okText)}</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector("#mc").onclick = closeModal;
  d.querySelector("#mo").onclick = () => { closeModal(); onOk(); };
  d.onclick = e => { if (e.target === d) closeModal(); };
}

renderStart();
})();
</script>
</body>
